services:
  - type: web
    name: astra-ai-server
    env: node
    plan: free
    region: oregon  # closest free-tier region; change to frankfurt if you're in Europe
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 10000          # Render free tier always exposes port 10000
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard, NOT here — never commit secrets.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: HINDSIGHT_BASE_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
